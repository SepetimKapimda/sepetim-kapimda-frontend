        description: Sipariş no (SM-15 veya 15) ya da müşteri adı / kullanıcı adı
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Bu tarihten (dahil) itibaren, YYYY-MM-DD
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELED
          - DELIVERED
          - HANDED_TO_COURIER
          - ON_THE_WAY
          - PREPARING
          - RECEIVED
          - WAITING_COURIER
        description: |-
          * `RECEIVED` - Sipariş Alındı (Market Onayı Bekliyor)
          * `PREPARING` - Hazırlanıyor (Market Hazırlıyor)
          * `WAITING_COURIER` - Kurye Bekleniyor (Boşta Kurye Yok)
          * `HANDED_TO_COURIER` - Kuryeye Verildi
          * `ON_THE_WAY` - Yolda (Kurye Dağıtımda)
          * `DELIVERED` - Teslim Edildi
          * `CANCELED` - İptal Edildi
      - in: query
        name: userId
        schema:
          type: number
        description: Belirli bir kullanıcının siparişleri
      tags:
      - Admin - Orders
      security:
      - jwtAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderList'
          description: ''
