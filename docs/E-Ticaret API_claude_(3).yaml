      description: 'Tüm siparişleri finansal kırılımıyla (market hakedişi, brüt kâr,
        admin/yönetici/kurye payları) yeniden eskiye, sayfalı listeler. Filtreler:
        `status`, `start_date`, `end_date` (sipariş tarihi, YYYY-MM-DD), `userId`,
        `search`. Geçersiz filtre değeri 400 döner.'
      summary: '[Eski Yol] Tüm Siparişleri Listele (Admin)'
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: Bu tarihe (dahil) kadar, YYYY-MM-DD
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
