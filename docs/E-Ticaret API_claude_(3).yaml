openapi: 3.0.3
info:
  title: E-Ticaret API
  version: 1.0.0
  description: Sanal Market uygulaması apisi
paths:
  /api/addresses/:
    get:
      operationId: api_addresses_list
      description: Auth olan kullanıcının adres listesini getirir.
      summary: Adres Listesi
      parameters:
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Her sayfada döndürülecek sonuç sayısı.
        schema:
          type: integer
      tags:
      - address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: api_addresses_create
      description: Auth olan kullanıcı için yeni adres ekler.
      summary: Adres Ekle
      tags:
      - address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/addresses/{address_id}:
    get:
      operationId: api_addresses_retrieve
      description: Auth olan kullanıcının seçilen adres detaylarını getirir.
      summary: Adres Detayları
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
    put:
      operationId: api_addresses_update
      description: Auth olan kullanıcının adresini günceller.
      summary: Adres Güncelle
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
    patch:
      operationId: api_addresses_partial_update
      description: Auth olan kullanıcının adresinin bazı alanlarını günceller.
      summary: Adres Güncelle (Kısmi)
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
    delete:
      operationId: api_addresses_destroy
      description: Auth olan kullanıcının adresini siler.
      summary: Adres Sil
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - address
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/addresses/admin/{user_id}:
    get:
      operationId: api_addresses_admin_list
      description: Admin, belirtilen kullanıcının tüm adreslerini listeler.
      summary: Kullanıcının Adresleri (Admin)
      parameters:
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Her sayfada döndürülecek sonuç sayısı.
        schema:
          type: integer
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: api_addresses_admin_create
      description: Admin, belirtilen kullanıcı adına yeni bir adres oluşturur.
      summary: Yeni Adres Oluştur (Admin)
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/addresses/admin/detail/{address_id}:
    get:
      operationId: api_addresses_admin_detail_retrieve
      description: Admin, herhangi bir adresin detaylarını getirir.
      summary: Adres Detayları (Admin)
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
    put:
      operationId: api_addresses_admin_detail_update
      description: Admin, herhangi bir adresi günceller.
      summary: Adres Güncelle (Admin)
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
    patch:
      operationId: api_addresses_admin_detail_partial_update
      description: Admin, herhangi bir adresin bazı alanlarını günceller.
      summary: Adres Güncelle (Kısmi, Admin)
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetail'
          description: ''
    delete:
      operationId: api_addresses_admin_detail_destroy
      description: Admin, herhangi bir adresi siler.
      summary: Adres Sil (Admin)
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - address
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/addresses/choices/:
    get:
      operationId: api_addresses_choices_retrieve
      description: 'İlçe anahtarlı mahalle listeleri: `{"akyazi": [{"value": "omercikler_mah",
        "label": "Ömercikler Mahallesi"}], "karapurcek": [...]}`. `value` adres kaydında
        gönderilir, `label` ekranda gösterilir.'
      summary: İlçe ve Mahalle Listeleri
      tags:
      - address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/notification-templates/:
    get:
      operationId: api_admin_notification_templates_list
      description: Telegram ve e-posta bildirimlerinin düzenlenebilir metinleri (Taslaklar
        ekranı).
      summary: 'Admin: Bildirim Şablonlarını Listele'
      parameters:
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Her sayfada döndürülecek sonuç sayısı.
        schema:
          type: integer
      tags:
      - Admin / Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationTemplateList'
          description: ''
  /api/admin/notification-templates/{id}/:
    get:
      operationId: api_admin_notification_templates_retrieve
      summary: 'Admin: Bildirim Şablonu Detayı'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin / Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
          description: ''
    put:
      operationId: api_admin_notification_templates_update
      description: Sadece `template_text` (e-posta şablonlarında ayrıca `subject`)
        güncellenir; `event_type` ve `channel` sabittir. Metinde `{{degisken}}` biçiminde
        yalnızca `available_placeholders` listesindeki değişkenler kullanılabilir,
        aksi halde 400 döner. **KVKK:** Telegram şablonlarında müşteri adı, adresi
        veya telefonu gibi kişisel veri değişkenleri yoktur; mesajlar sadece panele
        yönlendirir.
      summary: 'Admin: Bildirim Şablonunu Güncelle'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin / Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTemplate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationTemplate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationTemplate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
          description: ''
    patch:
      operationId: api_admin_notification_templates_partial_update
      description: Sadece `template_text` (e-posta şablonlarında ayrıca `subject`)
        güncellenir; `event_type` ve `channel` sabittir. Metinde `{{degisken}}` biçiminde
        yalnızca `available_placeholders` listesindeki değişkenler kullanılabilir,
        aksi halde 400 döner. **KVKK:** Telegram şablonlarında müşteri adı, adresi
        veya telefonu gibi kişisel veri değişkenleri yoktur; mesajlar sadece panele
        yönlendirir.
      summary: 'Admin: Bildirim Şablonunu Kısmi Güncelle'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin / Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationTemplate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationTemplate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationTemplate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
          description: ''
  /api/admin/orders/:
    get:
      operationId: api_admin_orders_list
      description: 'Tüm siparişleri finansal kırılımıyla (market hakedişi, brüt kâr,
        admin/yönetici/kurye payları) yeniden eskiye, sayfalı listeler. Filtreler:
        `status`, `start_date`, `end_date` (sipariş tarihi, YYYY-MM-DD), `userId`,
        `search`. Geçersiz filtre değeri 400 döner.'
      summary: Tüm Siparişleri Listele (Admin)
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: Bu tarihe (dahil) kadar, YYYY-MM-DD
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Her sayfada döndürülecek sonuç sayısı.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Sipariş no (SM-15 veya 15) ya da müşteri adı / kullanıcı adı
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Bu tarihten (dahil) itibaren, YYYY-MM-DD
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELED
          - DELIVERED
          - HANDED_TO_COURIER
          - ON_THE_WAY
          - PREPARING
          - RECEIVED
          - WAITING_COURIER
        description: |-
          * `RECEIVED` - Sipariş Alındı (Market Onayı Bekliyor)
          * `PREPARING` - Hazırlanıyor (Market Hazırlıyor)
          * `WAITING_COURIER` - Kurye Bekleniyor (Boşta Kurye Yok)
          * `HANDED_TO_COURIER` - Kuryeye Verildi
          * `ON_THE_WAY` - Yolda (Kurye Dağıtımda)
          * `DELIVERED` - Teslim Edildi
          * `CANCELED` - İptal Edildi
      - in: query
        name: userId
        schema:
          type: number
        description: Belirli bir kullanıcının siparişleri
      tags:
      - Admin - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderList'
          description: ''
  /api/admin/orders/{order_id}/:
    get:
      operationId: api_admin_orders_retrieve
      description: Siparişin finansal kırılımı, hukuki logları ve sözleşme snapshot'ı
        ile detayını döner.
      summary: Sipariş Detayı (Admin)
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
          description: ''
    put:
      operationId: api_admin_orders_update
      description: Siparişin durumunu (`status`) ve/veya atanmış kuryesini (`assigned_courier`)
        günceller.
      summary: Siparişi Güncelle (PUT, Admin)
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrderUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminOrderUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminOrderUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
          description: ''
    patch:
      operationId: api_admin_orders_partial_update
      description: '`{"status": "CANCELED"}` veya `{"assigned_courier": 5}`. Sonuçlanmış
        (DELIVERED/CANCELED) siparişler değiştirilemez. Manuel atamada kapasite kısıtı
        yoktur (meşgul kuryeye ikinci sipariş verilebilir). İptal edilen siparişin
        tüm hakediş payları sıfırlanır; kurye dahil kimse ücret almaz.'
      summary: Siparişi Güncelle (PATCH, Admin)
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
          description: ''
  /api/admin/payouts/:
    get:
      operationId: api_admin_payouts_list
      description: Platformun ödeyeceği talepler. Kurye talepleri burada görünmez;
        onları kurye yöneticisi öder.
      summary: Hakediş Talepleri (Market + Kurye Yöneticisi)
      parameters:
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Her sayfada döndürülecek sonuç sayısı.
        schema:
          type: integer
      - in: query
        name: recipient_type
        schema:
          type: string
        description: market | manager
      - in: query
        name: status
        schema:
          type: string
        description: PENDING | APPROVED | REJECTED
      tags:
      - Finance - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProcessorPayoutRequestList'
          description: ''
  /api/admin/payouts/{payout_id}/approve/:
    post:
      operationId: api_admin_payouts_approve_create
      description: Banka transferi yapıldıktan sonra talebi onaylar (isteğe bağlı
        dekont linkiyle); tutar alıcının bakiyesinden düşer.
      summary: Hakediş Talebini Onayla (Admin)
      parameters:
      - in: path
        name: payout_id
        schema:
          type: integer
        required: true
      tags:
      - Finance - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutProcess'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutProcess'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutProcess'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorPayoutRequest'
          description: ''
  /api/admin/payouts/{payout_id}/reject/:
    post:
      operationId: api_admin_payouts_reject_create
      description: Bekleyen talebi onaylar (`approve = True`) veya reddeder.
      summary: Hakediş Talebini Reddet (Admin)
      parameters:
      - in: path
        name: payout_id
        schema:
          type: integer
        required: true
      tags:
      - Finance - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutProcess'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutProcess'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutProcess'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorPayoutRequest'
          description: ''
  /api/admin/settings/:
    get:
      operationId: api_admin_settings_retrieve
      description: 'Site adı ve iletişim bilgileri; finans oranları (`markup_rate`,
        `admin_profit_share` yüzde olarak: `"20.00"` = %20; `courier_base_fee` TL);
        platformun sipariş ana şalteri (`is_ordering_open`); entegrasyon anahtarları.
        `resend_api_key` ve `telegram_bot_token` veritabanında şifreli tutulur ve
        yanıtta maskeli döner (Örn: `re_********cdef`).'
      summary: 'Admin: Platform Ayarları (İletişim, Finans Oranları, Entegrasyonlar)'
      tags:
      - Admin / Core
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoreSetting'
          description: ''
    put:
      operationId: api_admin_settings_update
      summary: 'Admin: Platform Ayarlarını Güncelle'
      tags:
      - Admin / Core
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStoreSetting'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminStoreSetting'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminStoreSetting'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoreSetting'
          description: ''
    patch:
      operationId: api_admin_settings_partial_update
      description: 'Oranlar yüzde gönderilir (`{"markup_rate": "25.00"}` = %25; %0-%100
        arası). Oran değişikliği müşteri fiyatlarına anında, hakedişlere sadece yeni
        siparişlerde yansır. Anahtar alanlarında: `***` içeren (maskeli) değer gönderilirse
        kayıtlı anahtar DEĞİŞMEZ; yeni düz metin gönderilirse şifrelenerek kaydedilir;
        boş string gönderilirse anahtar silinir.'
      summary: 'Admin: Platform Ayarlarını Kısmi Güncelle'
      tags:
      - Admin / Core
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminStoreSetting'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminStoreSetting'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminStoreSetting'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStoreSetting'
