        Admin platform ayarları: iletişim bilgileri, finans oranları, platformun sipariş ana şalteri ve veritabanında
        şifreli tutulan entegrasyon anahtarları (maskeli). Oran değişiklikleri müşteri fiyatlarına anında, sipariş
