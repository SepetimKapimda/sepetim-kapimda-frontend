    PatchedAdminStoreSetting:
      type: object
      description: |-
        Admin platform ayarları: iletişim bilgileri, finans oranları, platformun sipariş ana şalteri ve veritabanında
        şifreli tutulan entegrasyon anahtarları (maskeli). Oran değişiklikleri müşteri fiyatlarına anında, sipariş
        hakedişlerine sadece yeni siparişlerde yansır (verilmiş siparişlerin tutarları mühürlüdür).
      properties:
        site_name:
          type: string
          title: Site Adı
          maxLength: 100
        contact_email:
          type: string
          format: email
          title: Destek E-postası
          maxLength: 254
        branch_1_phone:
          type: string
          nullable: true
          title: Şube 1 Telefon
          maxLength: 20
        branch_2_phone:
          type: string
          nullable: true
          title: Şube 2 Telefon
          maxLength: 20
        whatsapp_line:
          type: string
          nullable: true
          title: WhatsApp Destek Hattı
          maxLength: 20
        instagram_url:
          type: string
          format: uri
          nullable: true
          title: Instagram Linki
          maxLength: 200
        facebook_url:
          type: string
          format: uri
          nullable: true
          title: Facebook Linki
          maxLength: 200
        markup_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: 'Kâr marjı, yüzde: "20.00" = %20'
        admin_profit_share:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Brüt kâr havuzundan admin payı, yüzde (kalanı Kurye Yöneticisinin)
        courier_base_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Kurye paket başı ücreti (TL)
        is_ordering_open:
          type: boolean
          description: 'Platformun sipariş ana şalteri (false: hiçbir sipariş alınmaz)'
        resend_api_key:
          type: string
          nullable: true
          description: 'Örn: re_123... — yanıtta maskeli döner'
          maxLength: 255
        telegram_bot_token:
          type: string
          nullable: true
          description: 'Örn: 123456789:AA... — yanıtta maskeli döner'
          maxLength: 255
