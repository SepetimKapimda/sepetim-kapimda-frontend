  /api/orders/{order_id}/auto-assign/:
    post:
      operationId: api_orders_auto_assign_create
      description: |-
        'Hazırlanıyor' (PREPARING) veya 'Kurye Bekleniyor' (WAITING_COURIER) durumundaki ve henüz kuryesi olmayan siparişe aktif, müsait ve elinde hiç açık sipariş olmayan kuryeyi (en uzun süredir teslimat yapmayandan başlayarak) atar ve siparişi doğrudan 'Yolda' (ON_THE_WAY) durumuna geçirir (200). Kurye Yöneticisi çağırırsa sadece kendi kuryeleri aday olur.

        Boşta kurye yoksa sipariş 'Kurye Bekleniyor' (WAITING_COURIER) durumuna geçer, kurye yöneticilerine Telegram ve anlık bildirim gider ve **202** döner (`courier: null`). Yönetici manuel atama yapabilir (elinde aktif teslimat olan kuryeye de) veya bu uç daha sonra tekrar çağrılabilir.
      summary: Siparişe Otomatik Kurye Ata ve Yola Çıkar
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - Order - Dispatch
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAssignResponse'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAssignResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                example:
                  success: false
                  error:
                    message: 'Otomatik atama sadece ''Hazırlanıyor'' veya ''Kurye
                      Bekleniyor'' durumundaki siparişler için yapılabilir (mevcut
                      durum: ''Sipariş Alındı (Market Onayı Bekliyor)'').'
                    status_code: 400
          description: ''
