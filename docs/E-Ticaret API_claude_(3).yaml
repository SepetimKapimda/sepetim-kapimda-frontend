    StaffCreate:
      type: object
      description: |-
        Market Sahibi veya Kurye Yöneticisi hesabı açar (User + UserProfile + rol profili tek işlemde).
        `username` gönderilmezse e-posta kullanıcı adı olur (giriş ekranında e-posta yazılır).
        Hesap personel adına açıldığı için KVKK/üyelik onayı işaretlenmez (onayı kişinin kendisi verir).
      properties:
