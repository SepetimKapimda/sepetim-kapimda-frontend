          - ON_THE_WAY
          - PREPARING
          - RECEIVED
          - WAITING_COURIER
          - canceled
          - delivered
          - on_the_way
          - waiting
        description: |-
          waiting | on_the_way | delivered | canceled (veya tam durum kodu)

          * `waiting` - waiting
          * `on_the_way` - on_the_way
          * `delivered` - delivered
          * `canceled` - canceled
          * `RECEIVED` - Sipariş Alındı (Market Onayı Bekliyor)
          * `PREPARING` - Hazırlanıyor (Market Hazırlıyor)
          * `WAITING_COURIER` - Kurye Bekleniyor (Boşta Kurye Yok)
          * `HANDED_TO_COURIER` - Kuryeye Verildi
          * `ON_THE_WAY` - Yolda (Kurye Dağıtımda)
          * `DELIVERED` - Teslim Edildi
          * `CANCELED` - İptal Edildi
