      description: |
        Aktif ürünlerin listesini döner. Filtreleme, arama ve sıralama desteği sunar.

        **Fiyat:** `selling_price`, markete ödenen `market_price` üzerine global markup eklenerek anlık hesaplanır.

        **Filtreleme parametreleri:**
        - `isHome=true`: Anasayfa fırsat ürünleri
        - `category=<slug>`: Kategoriye göre
        - `name__iexact`, `name__icontains`: Ürün adına göre
        - `price__gt`, `price__gte`, `price__lt`, `price__lte`: Müşteri fiyatına göre
        - `price__range`: Örnek: `?price__range=100,500`
        - `discounted=true`: Sadece indirimdeki ürünler

        **Arama:** `?q=elma`

        **Sıralama:** `?ordering=price`, `?ordering=-price` veya `?ordering=name`
      summary: Ürün Listesi
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: discounted
        schema:
          type: boolean
      - in: query
        name: isHome
        schema:
          type: boolean
      - in: query
        name: name__icontains
        schema:
          type: string
      - in: query
        name: name__iexact
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Sonuçların sıralanmasında kullanılacak alan.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Her sayfada döndürülecek sonuç sayısı.
        schema:
          type: integer
      - in: query
        name: price__gt
        schema:
          type: number
      - in: query
        name: price__gte
        schema:
          type: number
      - in: query
        name: price__lt
        schema:
          type: number
      - in: query
        name: price__lte
        schema:
          type: number
      - in: query
        name: price__range
        schema:
          type: array
          items:
            type: number
        description: 'Örnek: 100,500'
        explode: false
        style: form
      - name: q
        required: false
        in: query
        description: Bir arama terimi.
        schema:
          type: string
      tags:
      - Product
      security:
      - jwtAuth: []
