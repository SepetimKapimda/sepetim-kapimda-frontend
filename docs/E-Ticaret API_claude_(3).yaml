  /api/markets/orders/history/:
    get:
      operationId: api_markets_orders_history_list
      description: Sonuçlanmış (teslim edilmiş / iptal edilmiş) siparişler, sonuçlanma
        anına göre yeniden eskiye sayfalı. `?status=delivered|canceled`, `?date=today|week|month`,
        özel aralık için `?date=custom&start=YYYY-MM-DD&end=YYYY-MM-DD`.
      summary: Geçmiş Siparişler (Market, Filtreli)
      parameters:
      - in: query
        name: date
        schema:
          type: string
          enum:
          - custom
          - month
          - monthly
          - today
          - week
          - weekly
        description: |-
          today | week | month | custom (custom için start ve end)

          * `today` - Bugün
          * `weekly` - Bu Hafta
          * `monthly` - Bu Ay
          * `week` - Bu Hafta
          * `month` - Bu Ay
          * `custom` - Özel Aralık
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: YYYY-MM-DD (dahil)
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Her sayfada döndürülecek sonuç sayısı.
        schema:
          type: integer
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: YYYY-MM-DD (dahil)
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELED
          - DELIVERED
          - HANDED_TO_COURIER
          - ON_THE_WAY
          - PREPARING
          - RECEIVED
          - WAITING_COURIER
          - canceled
          - delivered
        description: |-
          delivered | canceled

          * `delivered` - delivered
          * `canceled` - canceled
          * `RECEIVED` - Sipariş Alındı (Market Onayı Bekliyor)
          * `PREPARING` - Hazırlanıyor (Market Hazırlıyor)
          * `WAITING_COURIER` - Kurye Bekleniyor (Boşta Kurye Yok)
          * `HANDED_TO_COURIER` - Kuryeye Verildi
          * `ON_THE_WAY` - Yolda (Kurye Dağıtımda)
          * `DELIVERED` - Teslim Edildi
          * `CANCELED` - İptal Edildi
      tags:
      - Market
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
