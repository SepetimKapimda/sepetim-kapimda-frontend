    NotificationTemplate:
      type: object
      description: Olay ve kanal sabittir; admin sadece metni (e-postada konuyu da)
        düzenler.
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
          title: Olay
        event_type_display:
          type: string
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          readOnly: true
          title: Kanal
        channel_display:
          type: string
          readOnly: true
        recipients:
          type: string
          readOnly: true
        subject:
          type: string
          title: E-posta Konusu
          maxLength: 200
        template_text:
          type: string
          maxLength: 3500
        available_placeholders:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTemplatePlaceholder'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Son Güncelleme
      required:
      - available_placeholders
      - channel
      - channel_display
      - event_type
      - event_type_display
      - id
      - recipients
      - template_text
      - updated_at
    NotificationTemplatePlaceholder:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
      - description
      - name
    NullEnum:
      enum:
      - null
    Order:
      type: object
      description: Müşteri, market ve kurye panellerinin gördüğü sipariş. Hakediş
        (finans) alanlarını İÇERMEZ.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
          title: Teslim Zamanı
        canceled_at:
          type: string
          format: date-time
          nullable: true
          title: İptal Zamanı
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        status_display:
          type: string
          readOnly: true
        assigned_courier:
          type: string
          nullable: true
          readOnly: true
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Teslimat Mesafesi (KM)
        customer_courier_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          title: Teslimat Ücreti
        coupon_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Kupon İndirimi
        order_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Müşterinin Ödeyeceği Toplam
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_method_display:
          type: string
          readOnly: true
        courier_note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        addresses:
          allOf:
          - $ref: '#/components/schemas/OrderAddresses'
          readOnly: true
        eta_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Tahmini Varış Süresi (Dk)
      required:
      - addresses
      - assigned_courier
      - created
      - id
      - items
      - payment_method_display
      - status_display
      - updated
      - user
    OrderAddress:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        address_line:
          type: string
          nullable: true
          maxLength: 255
        street:
          type: string
          maxLength: 255
        district:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DistrictEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        district_display:
          type: string
          readOnly: true
        neighborhood:
          $ref: '#/components/schemas/NeighborhoodEnum'
        neighborhood_display:
          type: string
          readOnly: true
        city:
          type: string
          maxLength: 20
        postal_code:
          type: string
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
      required:
      - district_display
      - full_name
      - id
      - latitude
      - longitude
      - neighborhood
      - neighborhood_display
      - phone
      - street
    OrderAddresses:
      type: object
      properties:
        delivery:
          allOf:
          - $ref: '#/components/schemas/OrderAddress'
          readOnly: true
        billing:
          allOf:
          - $ref: '#/components/schemas/OrderAddress'
          readOnly: true
      required:
      - billing
      - delivery
    OrderCreate:
      type: object
      properties:
        delivery_address_id:
          type: integer
        billing_address_id:
          type: integer
        coupon_code:
          type: string
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          default: cash
        courier_note:
          type: string
          maxLength: 500
      required:
      - billing_address_id
      - delivery_address_id
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/OrderItemProduct'
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        review_id:
          type: integer
          nullable: true
          readOnly: true
          description: Kalem değerlendirildiyse değerlendirmenin id'si, değilse null
      required:
      - id
      - product
      - review_id
    OrderItemProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          readOnly: true
      required:
      - id
      - images
      - name
      - selling_price
    OrderPreviewRequest:
      type: object
      properties:
        delivery_address_id:
          type: integer
          description: Kullanıcının kayıtlı adresinin ID'si
      required:
      - delivery_address_id
    OrderStatusEnum:
      enum:
      - RECEIVED
      - PREPARING
      - WAITING_COURIER
      - HANDED_TO_COURIER
      - ON_THE_WAY
      - DELIVERED
      - CANCELED
      type: string
      description: |-
        * `RECEIVED` - Sipariş Alındı (Market Onayı Bekliyor)
        * `PREPARING` - Hazırlanıyor (Market Hazırlıyor)
        * `WAITING_COURIER` - Kurye Bekleniyor (Boşta Kurye Yok)
        * `HANDED_TO_COURIER` - Kuryeye Verildi
        * `ON_THE_WAY` - Yolda (Kurye Dağıtımda)
        * `DELIVERED` - Teslim Edildi
        * `CANCELED` - İptal Edildi
