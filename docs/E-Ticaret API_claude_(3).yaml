          type: string
          description: Sadece Market Sahibi
          maxLength: 255
      required:
      - email
      - name
      - password
      - role
    StaffMember:
      type: object
      description: Personel listesi/detayı (Market Sahibi, Kurye Yöneticisi, Admin).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Kullanıcı adı
